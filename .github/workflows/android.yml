# Builds the app on every push and pull request.
# Pushes to main publish a signed APK to the rolling "latest" pre-release;
# tags like v1.2.0 publish it to a release of their own.
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Pull requests (including forks) can't read the signing secrets, so they only get a debug build.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        if: env.PUBLISH != 'true'
        run: ./gradlew :app:assembleDebug

      - name: Build signed release APK
        if: env.PUBLISH == 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0-build.{0}', github.run_number) }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          ./gradlew :app:assembleRelease
          rm "$SIGNING_STORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "collage-$VERSION_NAME.apk"
          echo "APK=collage-$VERSION_NAME.apk" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Check the APK is signed with the release key
        if: env.PUBLISH == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -q "CN=Collage" certs.txt

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            collage-*.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to the "latest" pre-release
        if: env.PUBLISH == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($VERSION_NAME)" \
            --notes "Built from $GITHUB_SHA. Installs over earlier builds from this repo."

      - name: Publish tagged release
        if: env.PUBLISH == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes
